; platform.ini — Waveshare ESP32-S3-ETH-8DI-8RO
; Module: ESP32-S3-WROOM-1U-N16R8 (16MB Flash, 8MB Octal PSRAM)
;
; Platform: pioarduino (Arduino core 3.x on PlatformIO)
; https://github.com/pioarduino/platform-espressif32

[env:waveshare_esp32s3_eth_8di_8ro]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ── Flash & PSRAM ──────────────────────────────────────────
board_build.flash_size          = 16MB
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_build.arduino.memory_type = qio_opi

; ── CPU ────────────────────────────────────────────────────
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L

; ── Serial / Upload ────────────────────────────────────────
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ── Build Flags ────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Allow WebSocketsClient to work on plain ws:// without SSL
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32

; ── Library Dependencies ───────────────────────────────────
; ETH.h, WiFi.h, WebServer.h, Preferences.h — bundled with core 3.x
lib_deps =

    fastled/FastLED
    robtillaart/TCA9554
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
    links2004/WebSockets@2.7.3
