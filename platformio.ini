; platformio.ini — Waveshare ESP32-S3-ETH-8DI-8RO-C
;
; Module: ESP32-S3-WROOM-1U-N16R8 (16MB Flash, 8MB Octal PSRAM)
; Platform: pioarduino (Arduino core 3.x on PlatformIO)
;
; CAN / NMEA 2000:
;   GPIO17 = CAN TX (TWAI)
;   GPIO18 = CAN RX (TWAI)
;   On-board isolated CAN transceiver — no external chip needed.
;   Enable 120Ω termination jumper if this board is a bus endpoint.

[env:waveshare_esp32s3_eth_8di_8ro_c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ── Flash & PSRAM ──────────────────────────────────────────────────────────────
board_build.flash_size        = 16MB
board_build.flash_mode        = qio
board_build.partitions        = default_16MB.csv
board_upload.flash_size       = 16MB
board_build.arduino.memory_type = qio_opi

; ── CPU ────────────────────────────────────────────────────────────────────────
board_build.f_cpu   = 240000000L
board_build.f_flash = 80000000L

; ── Serial / Upload ────────────────────────────────────────────────────────────
upload_speed     = 921600
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder

; ── Build Flags ────────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Allow WebSocketsClient to work on plain ws:// without SSL
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
    ; Set CAN pins for NMEA2000_esp32_twai before any N2K include.
    ; These match the Waveshare -C board schematic.
    -DESP32_CAN_TX_PIN=GPIO_NUM_17
    -DESP32_CAN_RX_PIN=GPIO_NUM_18

; ── Library Dependencies ───────────────────────────────────────────────────────
; Core (unchanged from original)
;   ETH.h, WiFi.h, WebServer.h, Preferences.h — bundled with core 3.x
lib_deps =
    fastled/FastLED
    robtillaart/TCA9554
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7
    links2004/WebSockets@^2.4.1
    ; NMEA 2000 stack
    ttlappalainen/NMEA2000-library
    ; ESP32-S3 TWAI (IDF CAN) driver — required for S3/S2/C3.
    ; The older ttlappalainen/NMEA2000_esp32 uses a Thomas Barth driver
    ; that does NOT compile on ESP32-S3.
    https://github.com/sergei/NMEA2000_esp32_twai
